[package]
name = "distributed-resnet"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.7"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
ndarray = "0.16"
ort = "2.0.0-rc.9"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }


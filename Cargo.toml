[package]
name = "aitp"
version = "0.13.1"
edition = "2021"
description = "Experimental low-overhead transport for distributed LLM inference"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
hmac = "0.12"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

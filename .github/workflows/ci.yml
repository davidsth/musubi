name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust sources on pushes; check formatting on pull requests
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            cargo fmt --all
          else
            cargo fmt --all -- --check
          fi
      - name: Commit rustfmt changes on direct pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- '*.rs'; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  test-ubuntu:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release

  test-windows:
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release

  test-macos:
    needs: format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release
